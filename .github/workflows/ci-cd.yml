name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kubsu
          POSTGRES_PASSWORD: kubsu
          POSTGRES_DB: kubsu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install PDM
        run: |
          python3 install-pdm.py
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pdm install -G test

      - name: Verify database connection
        run: pg_isready -h localhost -p 5432 -U kubsu -d kubsu
        env:
          PGPASSWORD: kubsu

      - name: Run tests
        run: pdm run pytest tests/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://kubsu:kubsu@localhost:5432/kubsu
          PYTHONPATH: .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "Pulling latest image..."
            podman pull ghcr.io/${{ github.repository }}:latest
            
            echo "Stopping old container..."
            podman stop my-app || true
            podman rm my-app || true
            
            echo "Starting new container..."
            podman run -d \
              --name my-app \
              --restart unless-stopped \
              -p 8000:8000 \
              ghcr.io/${{ github.repository }}:latest
            
            echo "Deployment done!"
            podman ps | grep my-app